  icone: `<i class="bi bi-megaphone"></i>`
}

/* =========================================================
   CARDS
   ========================================================= */

function criarCards() {

const area = document.getElementById("pub-categorias");

Object.entries(categorias).forEach(([codigo, cat]) => {

  const n =
    publicacoes.filter(
      p => p.category === codigo
    ).length;

  const card = document.createElement("div");

  card.className =
    `pub-card card-${codigo}`;

  card.dataset.category = codigo;

  card.onclick =
    () => filtrarPublicacoes(codigo);

  card.innerHTML = `

    <div class="pub-icon-box">
      ${cat.icone}
    </div>

    <div class="pub-card-titulo">
      ${cat.nome}
    </div>

    <div class="pub-card-numero">
      ${n} ${n === 1 ? "publicação" : "publicações"}
    </div>

  `;

  area.appendChild(card);

});

}


/* =========================================================
   LISTA
   ========================================================= */

function renderizarLista(filtro = "todas") {

const area =
  document.getElementById("pub-lista");

area.innerHTML = "";


let dados = [...publicacoes];


if (filtro !== "todas") {

  dados = dados.filter(
    p => p.category === filtro
  );

}


dados.sort(
  (a, b) =>
    new Date(b.date) -
    new Date(a.date)
);


dados.forEach(pub => {

  const cat =
    categorias[pub.category];

  const ano =
    pub.date.substring(0, 4);


  const titulo =
    pub.path

      ? `<a href="${pub.path}"
            target="_blank"
            rel="noopener noreferrer">
            ${pub.title}
         </a>`

      : pub.title;


  const item =
    document.createElement("div");


  item.className =
    `pub-item item-${pub.category}`;


  item.innerHTML = `

    <div class="pub-item-icon">
      ${cat.icone}
    </div>


    <div class="pub-info">

      <div class="pub-title">
        ${titulo}
      </div>

      <div class="pub-author">
        ${pub.author}
      </div>

      <div class="pub-details">
        ${pub.description}
      </div>

      <span class="pub-tag tag-${pub.category}">
        ${cat.singular}
      </span>

    </div>


    <div class="pub-year">
      ${ano}
    </div>

  `;


  area.appendChild(item);

});

}


/* =========================================================
   FILTRO
   ========================================================= */

function filtrarPublicacoes(categoria) {

document
  .querySelectorAll(".pub-card")
  .forEach(
    x => x.classList.remove("ativo")
  );


if (categoria === "todas") {

  document
    .getElementById("pub-titulo-lista")
    .textContent =
      "Todas as publicações";

}

else {

  const card =
    document.querySelector(
      `[data-category="${categoria}"]`
    );

  if (card) {
    card.classList.add("ativo");
  }


  document
    .getElementById("pub-titulo-lista")
    .textContent =
      categorias[categoria].nome;

}


renderizarLista(categoria);

}


/* =========================================================
   INICIAR
   ========================================================= */

criarCards();
renderizarLista();

</script>

              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
