# Publica o site automaticamente a cada push na branch main.
# Funciona direto para sites sem código R que precise ser executado.
# Se o seu site RODA código R (chunks {r}), descomente o bloco do R abaixo.

on:
  push:
    branches: main
  workflow_dispatch:

name: Publicar site Quarto

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # --- Descomente para sites que executam código R ---
      # - name: Instalar R
      #   uses: r-lib/actions/setup-r@v2
      # - name: Instalar pacotes R
      #   uses: r-lib/actions/setup-r-dependencies@v2
      # ---------------------------------------------------

      - name: Renderizar e publicar
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
